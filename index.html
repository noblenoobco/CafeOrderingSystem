<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order System</title>
  
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Import Map to resolve module imports -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
      }
    }
  </script>
  <style>
    /* Prevent pull-to-refresh on mobile */
    body { overscroll-behavior-y: none; }
    /* Safe area padding for modern phones */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-gray-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc, query } from 'firebase/firestore';
    import { ShoppingCart, Plus, Minus, Trash2, Edit2, Image as ImageIcon, Bell, CheckCircle, Clock, X, LogIn, LogOut, LayoutDashboard, UtensilsCrossed, Settings, Info, Activity, ClipboardList, TrendingUp, CalendarDays, DollarSign, AlertTriangle, Flame, Award, Filter, ChevronDown, ChevronUp, Shield, Lock, Code, Copy } from 'lucide-react';

    let firebaseConfig;
    try {
        firebaseConfig = typeof window.__firebase_config !== 'undefined' 
            ? JSON.parse(window.__firebase_config) 
            : {
                apiKey: "AIzaSyAIkkD83uudTgRwghHWG4YYToa01URzuMc",
                authDomain: "fegt01.firebaseapp.com",
                projectId: "fegt01",
                storageBucket: "fegt01.firebasestorage.app",
                messagingSenderId: "928072192355",
                appId: "1:928072192355:web:ff35c3bde1f7ed1ef80356"
              };
    } catch(e) {
        console.error("Config parsing error:", e);
    }
    
    let app, auth, db;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
    } catch (e) {
        console.error("Firebase init error:", e);
    }
    
    // Dynamic App ID mapping
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'fegt01';

    // Utility to format currency in RM
    const formatRM = (amount) => `RM ${parseFloat(amount || 0).toFixed(2)}`;

    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; 
            let scaleSize = 1;
            if (img.width > MAX_WIDTH) {
              scaleSize = MAX_WIDTH / img.width;
            }
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const compressedBase64 = canvas.toDataURL('image/webp', 0.5);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = error => reject(error);
      });
    };

    const getBase64SizeInKB = (base64String) => {
      if (!base64String) return 0;
      const base64Data = base64String.split(',')[1] || base64String;
      const padding = (base64Data.match(/(=*)$/) || [])[1].length;
      const sizeInBytes = (base64Data.length * (3 / 4)) - padding;
      return sizeInBytes / 1024;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('customer'); // 'customer', 'admin', 'manager', 'waiter', 'architect'
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [isWaiterBoardOpen, setIsWaiterBoardOpen] = useState(false);
      
      // App Data State
      const [menuItems, setMenuItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);

      // Architect App Settings State
      const [appConfig, setAppConfig] = useState({ 
          isRestricted: false, 
          subMessage: 'System is currently disabled. Please contact the administrator regarding the monthly subscription.',
          pins: { architect: '7777', admin: '1234', manager: '9999', waiter: '5678' }
      });
      const [architectMessageInput, setArchitectMessageInput] = useState('');
      const [pinConfig, setPinConfig] = useState({ architect: '7777', admin: '1234', manager: '9999', waiter: '5678' });
      const [newFirebaseConfig, setNewFirebaseConfig] = useState(`{\n  apiKey: "YOUR_API_KEY",\n  authDomain: "your-app.firebaseapp.com",\n  projectId: "your-app",\n  storageBucket: "your-app.firebasestorage.app",\n  messagingSenderId: "123456789",\n  appId: "1:123456789:web:abcdef"\n}`);
      const [copiedAction, setCopiedAction] = useState(false);

      // Customer State
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [expandedMobileItems, setExpandedMobileItems] = useState({}); // Stores expanded mobile menu item IDs
      
      // Checkout & Table State
      const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
      const [tableNumber, setTableNumber] = useState('1');
      const [diningOption, setDiningOption] = useState('dine-in'); // 'dine-in' or 'takeaway'
      const [customerNote, setCustomerNote] = useState('');

      // Admin State
      const [activeTab, setActiveTab] = useState('orders'); // 'orders', 'menu', 'dashboard', 'architect'
      const [editingItem, setEditingItem] = useState(null);
      const [eraseTarget, setEraseTarget] = useState(null); // 'orders' | 'all' | null
      const [isErasing, setIsErasing] = useState(false);
      
      // Stats Filter State
      const [statsTimeframe, setStatsTimeframe] = useState('today'); // 'today', 'week', 'month', 'all'

      useEffect(() => {
        if(!auth) {
            setLoading(false);
            return;
        }
        
        let isMounted = true;
        
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth Error:", error);
          }
        };
        
        initAuth();
        
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (isMounted) {
              setUser(currentUser);
              setLoading(false);
          }
        });
        
        return () => {
            isMounted = false;
            unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!user || !db) return;

        // Fetch Menu (Public Data) strictly using path rules
        const menuRef = collection(db, 'artifacts', appId, 'public', 'data', 'menu');
        const unsubscribeMenu = onSnapshot(query(menuRef), 
          (snapshot) => {
            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setMenuItems(items);
          },
          (error) => console.error("Menu fetch error:", error)
        );

        // Fetch Orders strictly using path rules
        const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const unsubscribeOrders = onSnapshot(query(ordersRef),
          (snapshot) => {
            const fetchedOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            // Sort in memory to avoid index requirements
            fetchedOrders.sort((a, b) => b.timestamp - a.timestamp);
            setOrders(fetchedOrders);
          },
          (error) => console.error("Orders fetch error:", error)
        );

        // Fetch Architect App Settings (Public Data)
        const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'config');
        const unsubscribeConfig = onSnapshot(configRef, 
          (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                setAppConfig(data);
                setArchitectMessageInput(data.subMessage || '');
                if (data.pins) {
                    setPinConfig(data.pins);
                }
            } else {
                const defaultConfig = { 
                    isRestricted: false, 
                    subMessage: 'System is currently disabled. Please contact the administrator regarding the monthly subscription.',
                    pins: { architect: '7777', admin: '1234', manager: '9999', waiter: '5678' }
                };
                setDoc(configRef, defaultConfig);
            }
          },
          (error) => console.error("Config fetch error:", error)
        );

        return () => {
          unsubscribeMenu();
          unsubscribeOrders();
          unsubscribeConfig();
        };
      }, [user]);

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const toggleMobileExpand = (itemId) => {
        setExpandedMobileItems(prev => ({
          ...prev,
          [itemId]: !prev[itemId]
        }));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const openCheckoutPrompt = () => {
        if (cart.length === 0) return;
        setIsCartOpen(false);
        setIsCheckoutModalOpen(true);
      };

      const submitOrder = async (e) => {
        if (e) e.preventDefault();
        if (cart.length === 0 || !user || !db) return;
        
        try {
          const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
          await addDoc(ordersRef, {
            customerUserId: user.uid,
            items: cart,
            total: cartTotal,
            tableNumber: diningOption === 'dine-in' ? (tableNumber || 'N/A') : 'Takeaway',
            diningOption,
            customerNote: customerNote.trim(),
            status: 'pending',
            timestamp: Date.now()
          });
          setCart([]);
          setIsCheckoutModalOpen(false);
          setCustomerNote('');
        } catch (error) {
          console.error("Order submission failed:", error);
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const pins = appConfig?.pins || { architect: '7777', admin: '1234', manager: '9999', waiter: '5678' };

        if (adminPin === pins.architect || adminPin === '7777') { // Architect PIN (Fallback 7777 always works to prevent lockout)
          setUserRole('architect');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.admin) { // Admin PIN
          setUserRole('admin');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.manager) { // Manager PIN
          setUserRole('manager');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.waiter) { // Waiter PIN
          setUserRole('waiter');
          setShowAdminLogin(false);
          setAdminPin('');
          setIsWaiterBoardOpen(true); // Open waiter board immediately upon waiter login
        } else {
            setAdminPin('');
        }
      };

      const handleAdminLogout = () => {
        setUserRole('customer');
        setActiveTab('orders');
        setIsWaiterBoardOpen(false);
      };

      const updateOrderStatus = async (orderId, newStatus) => {
        if(!db) return;
        try {
          const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
          await updateDoc(orderRef, { status: newStatus });
        } catch (err) {
          console.error("Failed to update status:", err);
        }
      };
      
      const updateAppConfig = async (newConfig) => {
        if(!db) return;
        const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'config');
        try {
            await setDoc(configRef, { ...appConfig, ...newConfig }, { merge: true });
        } catch (err) {
            console.error("Failed to update app config:", err);
        }
      };

      const saveMenuItem = async (e) => {
        e.preventDefault();
        if(!db) return;
        const formData = new FormData(e.target);
        const file = formData.get('imageFile');
        
        let base64Image = editingItem?.image || '';
        
        if (file && file.size > 0) {
          base64Image = await compressImage(file);
        }

        const itemData = {
          name: formData.get('name'),
          category: formData.get('category'),
          description: formData.get('description'),
          price: parseFloat(formData.get('price')),
          available: formData.get('available') === 'on',
          image: base64Image
        };

        try {
          if (editingItem && editingItem.id) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', editingItem.id), itemData);
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'menu'), itemData);
          }
          setEditingItem(null);
        } catch (err) {
          console.error("Failed to save menu item:", err);
        }
      };

      const deleteMenuItem = async (id) => {
        if(!id || !db) return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', id));
        } catch (err) {
          console.error("Failed to delete menu item:", err);
        }
      };

      const executeErase = async () => {
        if(!db || !eraseTarget) return;
        setIsErasing(true);
        try {
          // Delete Orders
          if (eraseTarget === 'orders' || eraseTarget === 'all') {
            const promises = orders.map(order => 
              deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id))
            );
            await Promise.all(promises);
          }
          // Delete Menu Items
          if (eraseTarget === 'all') {
            const promises = menuItems.map(item => 
              deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', item.id))
            );
            await Promise.all(promises);
          }
          setEraseTarget(null);
        } catch (err) {
          console.error("Failed to erase data:", err);
        }
        setIsErasing(false);
      };

      // Customer views
      const myActiveOrders = orders.filter(o => o.customerUserId === user?.uid && o.status !== 'finished');
      
      // Alert Customer if any order is ready
      const newlyReadyOrders = myActiveOrders.filter(o => o.status === 'ready');
      const showReadyAlert = newlyReadyOrders.length > 0 && userRole === 'customer';

      // Admin & Waiter views
      const activeOrders = orders.filter(o => o.status !== 'finished');
      
      // Storage Calculation
      const totalStorageKB = menuItems.reduce((acc, item) => acc + getBase64SizeInKB(item.image), 0);

      // Earnings & Menu Analytics Calculations (Daily, Weekly, Monthly, All)
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const currentDay = now.getDay() || 7; 
      const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - currentDay + 1).getTime();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

      const dailyEarning = orders.reduce((sum, o) => o.timestamp >= startOfToday ? sum + o.total : sum, 0);
      const weeklyEarning = orders.reduce((sum, o) => o.timestamp >= startOfWeek ? sum + o.total : sum, 0);
      const monthlyEarning = orders.reduce((sum, o) => o.timestamp >= startOfMonth ? sum + o.total : sum, 0);

      // Filter orders by selected timeframe for detailed breakdown
      const filteredOrders = orders.filter(o => {
        if (statsTimeframe === 'today') return o.timestamp >= startOfToday;
        if (statsTimeframe === 'week') return o.timestamp >= startOfWeek;
        if (statsTimeframe === 'month') return o.timestamp >= startOfMonth;
        return true; // 'all'
      });

      const filteredTotalEarning = filteredOrders.reduce((sum, o) => sum + (o.total || 0), 0);

      // Frequently Ordered Menu Items (Best Sellers) calculation
      const itemSalesMap = {};
      filteredOrders.forEach(order => {
        if (Array.isArray(order.items)) {
          order.items.forEach(item => {
            const key = item.name || item.id;
            if (!itemSalesMap[key]) {
              itemSalesMap[key] = {
                name: item.name,
                category: item.category || 'General',
                totalQty: 0,
                totalRevenue: 0
              };
            }
            itemSalesMap[key].totalQty += (item.qty || 0);
            itemSalesMap[key].totalRevenue += ((item.price || 0) * (item.qty || 0));
          });
        }
      });

      const bestSellingItems = Object.values(itemSalesMap).sort((a, b) => b.totalQty - a.totalQty);
      
      if (loading) {
          return (
              <div className="min-h-screen flex items-center justify-center bg-gray-50">
                  <Activity className="animate-spin text-orange-500 w-12 h-12" />
              </div>
          );
      }
      
      // Architect Restriction Overlay (Blocks all users except Architect)
      if (appConfig?.isRestricted && userRole !== 'architect') {
          return (
              <div className="fixed inset-0 z-[9999] bg-slate-900 flex items-center justify-center p-4">
                   {/* Architect Login Logo to bypass restricted app */}
                   <button onClick={() => setShowAdminLogin(true)} className="absolute top-6 right-6 p-4 bg-white/5 hover:bg-white/20 text-white/40 hover:text-white rounded-full backdrop-blur-md transition-all z-[10000] border border-white/10 hover:border-white/30 shadow-2xl flex items-center justify-center group" title="System Login">
                       <Shield className="w-6 h-6 group-hover:scale-110 transition-transform" />
                   </button>

                   <div className="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl max-w-lg w-full text-center">
                      <AlertTriangle className="w-20 h-20 text-red-500 mx-auto mb-6 animate-pulse" />
                      <h2 className="text-3xl font-bold text-slate-900 mb-4">Service Notice</h2>
                      <div className="text-gray-700 text-lg whitespace-pre-wrap bg-red-50 p-4 rounded-xl border border-red-100">
                          {appConfig.subMessage || "System is currently disabled. Please contact the administrator regarding the monthly subscription."}
                      </div>
                   </div>

                   {/* Staff Login Modal (Duplicated here so Architect can login while app is blocked) */}
                   {showAdminLogin && (
                      <div className="fixed inset-0 z-[10001] flex items-center justify-center bg-slate-900/90 backdrop-blur-md p-4">
                        <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 relative">
                          <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full">
                            <X className="w-5 h-5"/>
                          </button>
                          <h3 className="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2"><LogIn className="w-5 h-5"/> Staff Login</h3>
                          <form onSubmit={handleAdminLogin}>
                            <input 
                              type="password" 
                              placeholder="Enter Access PIN" 
                              value={adminPin}
                              onChange={(e) => setAdminPin(e.target.value)}
                              className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-center text-lg tracking-widest font-mono mb-4"
                              autoFocus
                            />
                            <button type="submit" className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">Login</button>
                          </form>
                        </div>
                      </div>
                    )}
              </div>
          );
      }

      const renderKitchenCards = () => (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          {activeOrders.length === 0 ? (
            <div className="col-span-full py-12 text-center text-slate-500 bg-white rounded-xl shadow-sm border border-slate-200">
              <CheckCircle className="w-12 h-12 mx-auto mb-3 text-green-400 opacity-50"/>
              <p>All caught up! No active kitchen orders.</p>
            </div>
          ) : (
            activeOrders.map(order => (
              <div key={order.id} className={`bg-white rounded-xl shadow-sm overflow-hidden border-t-4 transition-all ${order.status === 'pending' ? 'border-orange-500' : order.status === 'cooking' ? 'border-blue-500' : 'border-green-500'}`}>
                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-gray-500 font-medium">Order #{order.id.slice(0,6).toUpperCase()}</span>
                      <span className={`px-2 py-0.5 rounded text-xs font-bold ${order.diningOption === 'takeaway' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                        {order.diningOption === 'takeaway' ? 'Takeaway' : `Table ${order.tableNumber}`}
                      </span>
                    </div>
                    <div className="text-xs text-gray-400 mt-0.5">{new Date(order.timestamp).toLocaleTimeString()}</div>
                  </div>
                  <span className={`px-2 py-1 rounded text-xs font-bold uppercase ${order.status === 'pending' ? 'bg-orange-100 text-orange-700' : order.status === 'cooking' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                    {order.status}
                  </span>
                </div>
                <div className="p-4">
                  {order.customerNote && (
                    <div className="mb-3 text-xs bg-amber-50 text-amber-800 p-2 rounded-lg border border-amber-200">
                      <span className="font-semibold">Note:</span> {order.customerNote}
                    </div>
                  )}
                  
                  {/* Detailed list of ordered menu items for kitchen/waiter */}
                  <div className="mb-3 font-semibold text-xs text-slate-400 uppercase tracking-wider">Ordered Items:</div>
                  <ul className="space-y-3 mb-4">
                    {order.items.map((item, idx) => (
                      <li key={idx} className="flex justify-between text-sm">
                        <span className="font-semibold text-slate-800"><span className="text-orange-500 font-bold mr-2">{item.qty}x</span> {item.name}</span>
                        <span className="text-gray-500">{formatRM(item.price * item.qty)}</span>
                      </li>
                    ))}
                  </ul>
                  
                  <div className="flex justify-between items-center pt-3 border-t border-gray-100 mb-4">
                    <span className="text-gray-500 font-medium text-sm">Total</span>
                    <span className="font-bold text-lg text-slate-800">{formatRM(order.total)}</span>
                  </div>

                  {order.status === 'pending' && (
                    <button onClick={() => updateOrderStatus(order.id, 'cooking')} className="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium transition-colors shadow-sm active:scale-[0.98]">
                      Start Cooking
                    </button>
                  )}
                  {order.status === 'cooking' && (
                    <button onClick={() => updateOrderStatus(order.id, 'ready')} className="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-medium transition-colors shadow-sm active:scale-[0.98]">
                      Done Cooking (Ready to Serve)
                    </button>
                  )}
                  {order.status === 'ready' && (
                    <button onClick={() => updateOrderStatus(order.id, 'finished')} className="w-full py-2.5 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium transition-colors shadow-sm active:scale-[0.98]">
                      Finish Order (Served)
                    </button>
                  )}
                </div>
              </div>
            ))
          )}
        </div>
      );

      const renderAdminDashboard = () => (
        <div className="flex h-screen bg-gray-100 overflow-hidden text-sm sm:text-base">
          {/* Admin Sidebar */}

          {isWaiterBoardOpen && (
            <div className="fixed inset-0 z-[150] bg-gray-100 flex flex-col animate-in zoom-in-95 duration-200">
              <div className="bg-slate-900 text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-10">
                <div className="flex items-center gap-2">
                  <Bell className="w-5 h-5 text-orange-400"/>
                  <h2 className="text-xl font-bold">Waiter Kitchen Live Board</h2>
                </div>
                <button onClick={() => setIsWaiterBoardOpen(false)} className="p-2 text-gray-300 hover:bg-slate-800 rounded-full"><X className="w-5 h-5"/></button>
              </div>
              <div className="flex-1 overflow-y-auto p-4 sm:p-6 max-w-7xl mx-auto w-full">
                <div className="mb-4 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                  <span className="text-sm font-bold text-slate-700">Active Kitchen Orders ({activeOrders.length})</span>
                  <span className="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full">Live Synchronized</span>
                </div>
                {renderKitchenCards()}
              </div>
            </div>
          )}

          {/* Staff Login Modal */}
          {showAdminLogin && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 relative">
                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full">
                  <X className="w-5 h-5"/>
                </button>
                <h3 className="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2"><LogIn className="w-5 h-5"/> Staff Login</h3>
                <form onSubmit={handleAdminLogin}>
                  <input 
                    type="password" 
                    placeholder="Enter Access PIN" 
                    value={adminPin}
                    onChange={(e) => setAdminPin(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-center text-sm sm:text-lg tracking-widest font-mono mb-4"
                    autoFocus
                  />
                  <button type="submit" className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">Login</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );

      return (userRole === 'admin' || userRole === 'manager' || userRole === 'architect') ? renderAdminDashboard() : renderCustomerView();
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
