  <script type="text/babel" data-type="module">

            ? JSON.parse(window.__firebase_config)

                authDomain: "fegt01.firebaseapp.com",
                projectId: "fegt01",

    } catch(e) {

    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'fegt01';

    const formatRM = (amount) => `RM ${parseFloat(amount || 0).toFixed(2)}`;

    const compressImage = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; 
            let scaleSize = 1;
            if (img.width > MAX_WIDTH) {
              scaleSize = MAX_WIDTH / img.width;
            }
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const compressedBase64 = canvas.toDataURL('image/webp', 0.5);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = error => reject(error);
      });
    };

    const getBase64SizeInKB = (base64String) => {
      if (!base64String) return 0;
      const base64Data = base64String.split(',')[1] || base64String;
      const padding = (base64Data.match(/(=*)$/) || [])[1].length;
      const sizeInBytes = (base64Data.length * (3 / 4)) - padding;
      return sizeInBytes / 1024;
    };

    function App() {
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState('customer');
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [isWaiterBoardOpen, setIsWaiterBoardOpen] = useState(false);
      
      const [menuItems, setMenuItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);

      const [appConfig, setAppConfig] = useState({ 
          isRestricted: false, 
          subMessage: 'System is currently disabled. Please contact the administrator regarding the monthly subscription.',
          pins: { architect: '7777', admin: '1234', manager: '9999', cashier: '1111', waiter: '5678' }
      });
      const [architectMessageInput, setArchitectMessageInput] = useState('');
      const [pinConfig, setPinConfig] = useState({ architect: '7777', admin: '1234', manager: '9999', cashier: '1111', waiter: '5678' });
      const [newFirebaseConfig, setNewFirebaseConfig] = useState(`{\n  apiKey: "YOUR_API_KEY",\n  authDomain: "your-app.firebaseapp.com",\n  projectId: "your-app",\n  storageBucket: "your-app.firebasestorage.app",\n  messagingSenderId: "123456789",\n  appId: "1:123456789:web:abcdef"\n}`);
      const [copiedAction, setCopiedAction] = useState(false);

      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [expandedMobileItems, setExpandedMobileItems] = useState({}); 
      
      const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
      const [tableNumber, setTableNumber] = useState('1');
      const [diningOption, setDiningOption] = useState('dine-in'); 
      const [customerNote, setCustomerNote] = useState('');
      const [customerPhone, setCustomerPhone] = useState(''); 

      const [activeTab, setActiveTab] = useState('orders'); 
      const [editingItem, setEditingItem] = useState(null);
      const [eraseTarget, setEraseTarget] = useState(null); 
      const [isErasing, setIsErasing] = useState(false);
      
      const [cashierSearch, setCashierSearch] = useState('');
      const [cashierFilter, setCashierFilter] = useState('all'); 
      const [receiptModalOrder, setReceiptModalOrder] = useState(null);
      const [promptWhatsAppOrder, setPromptWhatsAppOrder] = useState(null);
      const [customWhatsAppPhone, setCustomWhatsAppPhone] = useState('');

      const [statsTimeframe, setStatsTimeframe] = useState('today');

      useEffect(() => {
        if(!auth) {
            setLoading(false);
            return;
        }
        
        let isMounted = true;
        
        const initAuth = async () => {
          try {
            if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
              await signInWithCustomToken(auth, window.__initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth Error:", error);
          }
        };
        
        initAuth();
        
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (isMounted) {
              setUser(currentUser);
              setLoading(false);
          }
        });
        
        return () => {
            isMounted = false;
            unsubscribe();
        };
      }, []);

      useEffect(() => {
        if (!user || !db) return;

        const menuRef = collection(db, 'artifacts', appId, 'public', 'data', 'menu');
        const unsubscribeMenu = onSnapshot(query(menuRef), 
          (snapshot) => {
            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setMenuItems(items);
          },
          (error) => console.error("Menu fetch error:", error)
        );

        const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const unsubscribeOrders = onSnapshot(query(ordersRef),
          (snapshot) => {
            const fetchedOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            fetchedOrders.sort((a, b) => b.timestamp - a.timestamp);
            setOrders(fetchedOrders);
          },
          (error) => console.error("Orders fetch error:", error)
        );

        const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'config');
        const unsubscribeConfig = onSnapshot(configRef, 
          (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                setAppConfig(data);
                setArchitectMessageInput(data.subMessage || '');
                if (data.pins) {
                    setPinConfig({
                      architect: '7777',
                      admin: '1234',
                      manager: '9999',
                      cashier: '1111',
                      waiter: '5678',
                      ...data.pins
                    });
                }
            } else {
                const defaultConfig = { 
                    isRestricted: false, 
                    subMessage: 'System is currently disabled. Please contact the administrator regarding the monthly subscription.',
                    pins: { architect: '7777', admin: '1234', manager: '9999', cashier: '1111', waiter: '5678' }
                };
                setDoc(configRef, defaultConfig);
            }
          },
          (error) => console.error("Config fetch error:", error)
        );

        return () => {
          unsubscribeMenu();
          unsubscribeOrders();
          unsubscribeConfig();
        };
      }, [user]);

      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const toggleMobileExpand = (itemId) => {
        setExpandedMobileItems(prev => ({
          ...prev,
          [itemId]: !prev[itemId]
        }));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const openCheckoutPrompt = () => {
        if (cart.length === 0) return;
        setIsCartOpen(false);
        setIsCheckoutModalOpen(true);
      };

      const submitOrder = async (e) => {
        if (e) e.preventDefault();
        if (cart.length === 0 || !user || !db) return;
        
        try {
          const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
          await addDoc(ordersRef, {
            customerUserId: user.uid,
            items: cart,
            total: cartTotal,
            tableNumber: diningOption === 'dine-in' ? (tableNumber || 'N/A') : 'Takeaway',
            diningOption,
            customerNote: customerNote.trim(),
            customerPhone: customerPhone.trim(), 
            paymentStatus: 'unpaid', 
            paymentMethod: 'pending',
            status: 'pending',
            timestamp: Date.now()
          });
          setCart([]);
          setIsCheckoutModalOpen(false);
          setCustomerNote('');
          setCustomerPhone('');
        } catch (error) {
          console.error("Order submission failed:", error);
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const pins = appConfig?.pins || { architect: '7777', admin: '1234', manager: '9999', cashier: '1111', waiter: '5678' };

        if (adminPin === pins.architect || adminPin === '7777') { 
          setUserRole('architect');
          setActiveTab('orders');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.admin) { 
          setUserRole('admin');
          setActiveTab('orders');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.manager) { 
          setUserRole('manager');
          setActiveTab('orders');
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.cashier) { 
          setUserRole('cashier');
          setActiveTab('cashier'); 
          setShowAdminLogin(false);
          setAdminPin('');
        } else if (adminPin === pins.waiter) { 
          setUserRole('waiter');
          setShowAdminLogin(false);
          setAdminPin('');
          setIsWaiterBoardOpen(true); 
        } else {
          setAdminPin('');
        }
      };

      const handleAdminLogout = () => {
        setUserRole('customer');
        setActiveTab('orders');
        setIsWaiterBoardOpen(false);
      };

      const updateOrderStatus = async (orderId, newStatus) => {
        if(!db) return;
        try {
          const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
          await updateDoc(orderRef, { status: newStatus });
        } catch (err) {
          console.error("Failed to update status:", err);
        }
      };

      const updatePaymentStatus = async (orderId, paymentStatus, paymentMethod = 'Cash') => {
        if(!db) return;
        try {
          const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
          await updateDoc(orderRef, { paymentStatus, paymentMethod });
        } catch (err) {
          console.error("Failed to update payment status:", err);
        }
      };
      
      const updateAppConfig = async (newConfig) => {
        if(!db) return;
        const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'config');
        try {
            await setDoc(configRef, { ...appConfig, ...newConfig }, { merge: true });
        } catch (err) {
            console.error("Failed to update app config:", err);
        }
      };

      const saveMenuItem = async (e) => {
        e.preventDefault();
        if(!db) return;
        const formData = new FormData(e.target);
        const file = formData.get('imageFile');
        
        let base64Image = editingItem?.image || '';
        
        if (file && file.size > 0) {
          base64Image = await compressImage(file);
        }

        const itemData = {
          name: formData.get('name'),
          category: formData.get('category'),
          description: formData.get('description'),
          price: parseFloat(formData.get('price')),
          available: formData.get('available') === 'on',
          image: base64Image

        try {
          if (editingItem && editingItem.id) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', editingItem.id), itemData);
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'menu'), itemData);
          }
          setEditingItem(null);
        } catch (err) {
          console.error("Failed to save menu item:", err);
        }
      };

      const deleteMenuItem = async (id) => {
        if(!id || !db) return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', id));
        } catch (err) {
          console.error("Failed to delete menu item:", err);
        }
      };

      const executeErase = async () => {
        if(!db || !eraseTarget) return;
        setIsErasing(true);
        try {
          if (eraseTarget === 'orders' || eraseTarget === 'all') {
            const promises = orders.map(order => 
              deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id))
            );
            await Promise.all(promises);
          }
          if (eraseTarget === 'all') {
            const promises = menuItems.map(item => 
              deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'menu', item.id))
            );
            await Promise.all(promises);
          }
          setEraseTarget(null);
        } catch (err) {
          console.error("Failed to erase data:", err);
        }
        setIsErasing(false);
      };

      const formatWhatsAppNumber = (phoneStr) => {
        if (!phoneStr) return '';
        let cleaned = phoneStr.replace(/\D/g, ''); 
        if (cleaned.startsWith('0')) {
          cleaned = '60' + cleaned.slice(1); 
        }
        return cleaned;
      };

      const generateReceiptMessage = (order) => {
        const orderId = order.id ? order.id.slice(0,6).toUpperCase() : 'N/A';
        const dateStr = new Date(order.timestamp).toLocaleString();
        const dining = order.diningOption === 'takeaway' ? 'TAKEOUT' : `TABLE ${order.tableNumber}`;
        const payStatus = order.paymentStatus === 'paid' ? `PAID (${order.paymentMethod || 'Cash'})` : 'UNPAID';
        
        let msg = `🧾 *RECEIPT - KIOSK ORDER*\n`;
        msg += `--------------------------------\n`;
        msg += `Order ID: #${orderId}\n`;
        msg += `Dining: ${dining}\n`;
        msg += `Date: ${dateStr}\n`;
        msg += `--------------------------------\n`;
        order.items.forEach(item => {
          msg += `${item.qty}x ${item.name} - ${formatRM(item.price * item.qty)}\n`;
        });
        msg += `--------------------------------\n`;
        msg += `*TOTAL AMOUNT: ${formatRM(order.total)}*\n`;
        msg += `Payment Status: *${payStatus}*\n`;
        if (order.customerNote) {
          msg += `Note: ${order.customerNote}\n`;
        }
        msg += `--------------------------------\n`;
        msg += `Thank you for dining with us! Have a great day! 🙏`;
        
        return msg;
      };

      const sendReceiptToWhatsApp = async (order, explicitPhone = null) => {
        const phone = explicitPhone || order.customerPhone;
        if (!phone) {
          setPromptWhatsAppOrder(order);
          setCustomWhatsAppPhone('');
          return;
        }

        const cleanedPhone = formatWhatsAppNumber(phone);
        let textMessage = generateReceiptMessage(order);
        
        // Open window synchronously to avoid popup blocker on Desktop
        let waWindow = null;
        if (!navigator.canShare) { 
            waWindow = window.open('', '_blank');
            waWindow.document.write('<div style="font-family:sans-serif; padding: 20px;">Generating receipt image... please wait.</div>');
        }

        // Create temporary container for the receipt
        const container = document.createElement('div');
        container.style.position = 'absolute';
        container.style.left = '-9999px';
        container.style.top = '0';
        container.style.width = '380px';
        container.style.padding = '24px';
        container.style.background = '#ffffff';
        container.style.color = '#000000';
        container.style.fontFamily = 'monospace';
        container.style.fontSize = '14px';
        container.style.boxSizing = 'border-box';
        
        // Build receipt HTML
        let html = `
          <div style="text-align: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 16px;">
            <h2 style="margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; font-family: sans-serif;">KioskOrder Cafe</h2>
            <p style="margin: 4px 0 0; color: #64748b; font-size: 12px;">Official Sales Receipt</p>
            <div style="margin-top: 12px; font-size: 13px; color: #334155; text-align: left;">
              <div>Order #${order.id ? order.id.slice(0,6).toUpperCase() : 'N/A'}</div>
              <div>Date: ${new Date(order.timestamp).toLocaleString()}</div>
              <div style="font-weight: 700; margin-top: 4px; color: #0f172a;">${order.diningOption === 'takeaway' ? 'Takeaway' : `Table ${order.tableNumber}`}</div>
            </div>
          </div>
          <div style="border-bottom: 2px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 16px;">
        `;
        order.items.forEach(item => {
          html += `
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="flex: 1; padding-right: 10px;">${item.qty}x ${item.name}</span>
              <span style="font-weight: 600;">${formatRM(item.price * item.qty)}</span>
            </div>
          `;
        });
        html += `
          </div>
          <div style="border-bottom: 2px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 16px; text-align: right;">
            <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin-bottom: 8px;">
              <span>TOTAL:</span>
              <span>${formatRM(order.total)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; color: #475569; font-size: 13px;">
              <span>Payment Status:</span>
              <span style="font-weight: 700; text-transform: uppercase;">${order.paymentStatus === 'paid' ? `PAID (${order.paymentMethod || 'Cash'})` : 'UNPAID'}</span>
            </div>
          </div>
          <div style="text-align: center; color: #64748b; font-size: 12px;">
            <p style="margin: 0;">Thank you for dining with us!</p>
            <p style="margin: 4px 0 0; font-size: 10px; color: #94a3b8;">Please keep this receipt for verification.</p>
          </div>
        `;
        
        container.innerHTML = html;
        document.body.appendChild(container);
        
        try {
          if (!window.html2canvas) {
             throw new Error("html2canvas script is missing.");
          }
          
          const canvas = await window.html2canvas(container, { scale: 2, backgroundColor: '#ffffff', logging: false });
          canvas.toBlob(async (blob) => {
            document.body.removeChild(container);
            const file = new File([blob], `Receipt_${order.id ? order.id.slice(0,6) : 'Order'}.png`, { type: 'image/png' });
            
            // Try Mobile Native Share First (Attaches file seamlessly to WA app)
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                if (waWindow) waWindow.close(); 
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Order Receipt',
                        text: textMessage
                    });
                    return; 
                } catch (e) {
                    console.log("Share API cancelled or failed", e);
                    return;
                }
            }

            // Desktop Fallback: Copy to Clipboard and prompt to paste
            let copied = false;
            try {
                const item = new window.ClipboardItem({ "image/png": blob });
                await navigator.clipboard.write([item]);
                copied = true;
            } catch (e) {
                console.log("Clipboard API failed", e);
            }

            if (copied) {
                textMessage += "\n\n(Paste the receipt image here)";
                
                // Show floating custom toast for Cashier instruction
                const toast = document.createElement('div');
                toast.innerHTML = "✅ Receipt IMAGE copied to clipboard!<br>Please PASTE (Ctrl+V) in the WhatsApp chat.";
                toast.style.cssText = "position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:16px 24px;border-radius:12px;z-index:999999;font-weight:bold;text-align:center;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); font-family: sans-serif;";
                document.body.appendChild(toast);
                setTimeout(() => { if (document.body.contains(toast)) toast.remove() }, 6000);
            }

            const waUrl = `https://wa.me/${cleanedPhone}?text=${encodeURIComponent(textMessage)}`;
            if (waWindow) {
                waWindow.location.href = waUrl;
            } else {
                window.open(waUrl, '_blank');
            }
          }, 'image/png');
        } catch (err) {
            console.error("Canvas rendering error:", err);
            if (document.body.contains(container)) document.body.removeChild(container);
            const waUrl = `https://wa.me/${cleanedPhone}?text=${encodeURIComponent(textMessage)}`;
            if (waWindow) {
                waWindow.location.href = waUrl;
            } else {
                window.open(waUrl, '_blank');
            }
        }
      };

      const myActiveOrders = orders.filter(o => o.customerUserId === user?.uid && o.status !== 'finished');
      
      const newlyReadyOrders = myActiveOrders.filter(o => o.status === 'ready');
      const showReadyAlert = newlyReadyOrders.length > 0 && userRole === 'customer';

      const activeOrders = orders.filter(o => o.status !== 'finished');
      
      const totalStorageKB = menuItems.reduce((acc, item) => acc + getBase64SizeInKB(item.image), 0);

      const now = new Date();

          {showAdminLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 relative animate-in zoom-in-95 duration-200">
                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full"><X className="w-5 h-5"/></button>
                <h3 className="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2"><LogIn className="w-5 h-5"/> Staff Login</h3>
                <form onSubmit={handleAdminLogin}>
                  <input 
                    type="password" 
                    placeholder="Enter Access PIN" 
                    value={adminPin}
                    onChange={(e) => setAdminPin(e.target.value)}
                    className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-center text-lg tracking-widest font-mono mb-4"
                    autoFocus
                  />
                  <button type="submit" className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">Login</button>
                </form>
              </div>
            </div>
          )}

          {isWaiterBoardOpen && userRole === 'waiter' && (
             <div className="fixed inset-0 z-[100] bg-gray-100 overflow-y-auto">
                <div className="sticky top-0 bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-10">
                   <h2 className="text-xl font-bold flex items-center gap-2"><ClipboardList className="w-5 h-5"/> Waiter View (Live Kitchen)</h2>
                   <button onClick={() => setIsWaiterBoardOpen(false)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition-colors"><X className="w-5 h-5"/></button>
                </div>
                <div className="p-4 sm:p-8 max-w-6xl mx-auto">
                    {renderKitchenCards()}
                </div>
             </div>
          )}

        </div>
      );

      return ['admin', 'manager', 'cashier', 'architect'].includes(userRole) ? renderAdminDashboard() : renderCustomerView();
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
